name: checks

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Тесты
        run: python -m unittest -v
